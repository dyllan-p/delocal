[package]
name = "delocal"
description = "Keep a folder identical across all of your machines, over your tailnet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A library and a binary of the same name. The library holds the daemon's
# machinery, so its tests sit next to it and later crates' tests can use it;
# the binary is the CLI and the daemon's entry point.
[lib]
path = "src/lib.rs"

[[bin]]
name = "delocal"
path = "src/main.rs"

[dependencies]
delocal-engine.workspace = true
filetime.workspace = true
rustix.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

# `faults` builds FaultyFs (DESIGN.md §14.2), the filesystem layer's
# fault-injecting wrapper, and the JSON fault spec it reads. Tests and the
# chaos harness turn it on; the binary users download is built without it,
# so it cannot inject faults and does not carry the code.
[features]
faults = ["dep:serde", "dep:serde_json"]

[lints]
workspace = true
