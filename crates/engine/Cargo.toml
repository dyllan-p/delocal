[package]
name = "delocal-engine"
description = "Pure sync logic for delocal: index, versions, batches, conflicts, brake, simulator. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

# This crate does no I/O. It must never depend on tokio, notify, rusqlite,
# rand or anything else that touches the world (DESIGN.md Appendix B). serde
# is allowed so value types serialise directly. CI checks the tree.
[dependencies]
serde.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
