# CI for delocal (DESIGN.md §15 Phase 0).
#
# Four checks:
#   lint      fmt, clippy with warnings denied, and the engine boundary check
#   test      cargo test on Linux and macOS
#   build     release binaries for the four targets; Linux ones must be static
#   simulate  the §14.1 simulator: the pinned regression seeds and a random
#             sweep over 1,000 seeds split across four runners, all required
#             (the nightly runs 100,000)
#
# The toolchain comes from rust-toolchain.toml. `rustup toolchain install`
# with no arguments reads that file and installs the pinned version with its
# components and targets, so CI and a developer's machine use the same one.
#
# Linux jobs run on ubuntu-24.04, not ubuntu-latest, for the same reason the
# toolchain is pinned: `ubuntu-latest` moves to a new image on GitHub's
# schedule, and a new image should arrive in its own commit, not in the
# middle of an unrelated PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run for the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only helps repeated local builds; in CI it
  # costs time and cache space.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # DESIGN.md Appendix B: the engine does no I/O and depends on nothing
      # that does. `cargo tree -e normal` lists only normal (non-dev,
      # non-build) dependencies, which is what ships in the binary. If any
      # of these crates appear, the boundary is in the wrong place.
      - name: Engine boundary (dependencies)
        run: |
          set -euo pipefail
          tree="$(cargo tree -p delocal-engine -e normal --locked)"
          echo "$tree"
          if echo "$tree" | grep -E 'tokio|notify|rusqlite|reqwest|hyper|mio|rand'; then
            echo "::error::delocal-engine depends on an I/O or randomness crate (see CLAUDE.md, crate boundary)"
            exit 1
          fi

      # The engine also never reads the filesystem, the network or a clock
      # directly. Comments count too: the rule is simple on purpose, so pick
      # other words. `\b` keeps "Instant" from matching "instantly".
      - name: Engine boundary (source)
        run: |
          set -euo pipefail
          if grep -rnE 'std::fs\b|std::net\b|\bSystemTime\b|\bInstant\b' crates/engine/src; then
            echo "::error::delocal-engine source touches the world (see CLAUDE.md, crate boundary)"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux musl builds use `cross`, which runs cargo inside a
          # container that has the right linker and musl toolchain for the
          # target. The host toolchain (from rust-toolchain.toml) is used;
          # only the linker comes from the image.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            cross: true
            static: true
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            cross: true
            static: true
            run: false
          # macOS builds are native on the Apple silicon runner. The x86_64
          # target cross-compiles with the same SDK; it is not run here.
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            static: false
            run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            static: false
            run: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cross@0.2.5

      - name: Build release
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }} -p delocal

      # DESIGN.md §16: Linux binaries are fully static. Rust's musl targets
      # produce a static-pie executable by default; `file` reports that as
      # "static-pie linked" (newer) or "statically linked" (older). Anything
      # else, in particular "dynamically linked", fails the build.
      - name: Assert static
        if: matrix.static
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/delocal"
          desc="$(file "$bin")"
          echo "$desc"
          if ! echo "$desc" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::$bin is not statically linked"
            exit 1
          fi

      - name: Run
        if: matrix.run
        run: target/${{ matrix.target }}/release/delocal

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delocal-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/delocal
          if-no-files-found: error

  # DESIGN.md §14.1: 1,000 seeds per push with their own timeout, and the
  # pinned regression seeds (§14.4), all required. The simulator runs one
  # seed at a time on one core, so on one runner the 1,000 took about
  # fifteen minutes. They are split across four runners of 250 seeds each,
  # the pinned seeds run beside them on a fifth, and `simulate`, the check
  # the ruleset on main requires, passes only when all five have. SEEDS is
  # the total over all shards; it is what the nightly workflow overrides.
  # The random sweep was advisory (continue-on-error) until it first passed
  # clean at 1,000 seeds, and is required from that PR on. `--keep-going`
  # runs every seed in a shard and lists the failures by invariant before
  # it exits.
  simulate-pinned:
    name: simulate (pinned seeds)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: simulate

      - name: Pinned regression seeds
        run: cargo test --release --locked -p delocal-sim -- 'regressions::'

  simulate-sweep:
    name: simulate (sweep ${{ matrix.shard }} of ${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEEDS: 1000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      # The shards build the same binary under the same cache key. Only the
      # first saves it, so they do not race to upload identical caches.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: simulate
          save-if: ${{ strategy.job-index == 0 }}

      # This shard's share of seeds 0..SEEDS. `job-index` counts shards from
      # 0 and `job-total` is how many there are, so the matrix above is the
      # only place the number of shards is written.
      - name: Random sweep
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          start=$(( SEEDS * SHARD / SHARDS ))
          end=$(( SEEDS * (SHARD + 1) / SHARDS ))
          cargo run --release --locked -p delocal-sim -- --seeds "$(( end - start ))" --start "$start" --keep-going

  simulate:
    name: simulate
    needs: [simulate-pinned, simulate-sweep]
    # A job whose `needs` failed is skipped unless it asks to run anyway, and
    # a skipped job satisfies a required check. Without `always()` a failing
    # seed would leave `simulate` skipped and the PR mergeable.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pinned seeds and every shard passed
        env:
          PINNED: ${{ needs.simulate-pinned.result }}
          SWEEP: ${{ needs.simulate-sweep.result }}
        run: |
          echo "pinned seeds: $PINNED; sweep: $SWEEP"
          test "$PINNED" = success && test "$SWEEP" = success
