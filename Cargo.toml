[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dyllan-p/delocal"
rust-version = "1.98"

# Every dependency version is declared here once and inherited by member
# crates with `crate.workspace = true`. Only crates from DESIGN.md Appendix A
# may appear here. Phase 0 needs none.
[workspace.dependencies]
delocal-engine = { path = "crates/engine" }
serde = { version = "1.0.229", features = ["derive"] }
proptest = "1.11.0"
serde_json = "1.0.151"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = { version = "0.10.3", default-features = false, features = ["std"] }
rand_chacha = { version = "0.10.0", default-features = false }
blake3 = "1.8.7"
# The gitignore matcher only (DESIGN.md §7.3, Appendix A): the scanner walks
# through the filesystem layer itself, so its walker is never used.
ignore = "0.4.33"
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
tempfile = "3.27.0"
unicode-normalization = "0.1.25"
# `bundled` compiles SQLite from source into the binary, so it is static on
# musl and needs no system library (DESIGN.md Appendix A, §16). `cache` keeps
# prepared statements across a transaction's rows. The default features also
# pull in a WebAssembly build of SQLite, which no target here needs.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
# The daemon's runtime (DESIGN.md Appendix A): one engine task, its timers,
# the channels between it and the threads that do the I/O, and the signals
# that stop it. `macros` is for `select!`, not for `#[tokio::main]`.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
# `fmt` writes the log lines; ANSI colours and the `log` bridge are left out,
# since the lines go to files and nothing here logs through `log`.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2.5"
# The watcher (DESIGN.md §7.3, Appendix A): notify for the platform's file
# events, the debouncer for its 2 s of quiet per path. Default features:
# notify picks inotify on Linux and FSEvents on macOS.
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Release binaries are what users download, so trade compile time for a
# smaller, faster binary. `strip` removes debug symbols, `lto = "fat"` lets
# the optimiser see across crate boundaries, and one codegen unit gives it
# the whole crate at once.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
